name: memofix
description: "Application mobile de gestion sécurisée de notes, de mémos audio et de suivi de « bugs IRL »."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # Base de données locale
  sqflite: ^2.3.3
  path_provider: ^2.1.3
  path: ^1.9.1

  # Sécurité
  local_auth: ^2.1.7
  flutter_secure_storage: ^9.2.4

  # Audio
  record: ^6.0.0
  just_audio: ^0.10.4

  # Fichiers, images, permissions
  image_picker: ^1.1.2
  permission_handler: ^12.0.1

  # Réseau (métadonnées Spotify, téléchargement)
  dio: ^5.9.0
  http: ^1.6.0

  # UI
  cupertino_icons: ^1.0.6
  fluttertoast: ^8.2.6
  google_fonts: ^6.3.2
  line_icons: ^2.0.3
  lottie: ^2.7.0
  photo_view: ^0.15.0
  flutter_staggered_grid_view: ^0.7.0

  # Utilitaires
  collection: ^1.19.1
  intl: ^0.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  # Liste explicite : seuls les fichiers réellement utilisés sont embarqués.
  assets:
    - assets/animations/work.json
    - assets/db/memofix.db
    - assets/images/idee.jpg
    - assets/images/music.jpg
    - assets/images/secret-5.jpg
    - assets/images/tache.webp
    - assets/images/voyage.webp
    - assets/images/work.jpeg

flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  ios: true
