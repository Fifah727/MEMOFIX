name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.32.x"

jobs:
  release:
    name: Build signé (APK + AAB)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write # création de la GitHub Release
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier android/
        run: |
          test -d android/app || {
            echo "::error::Le dossier android/ est absent du dépôt. Restaurez-le (voir README)."
            exit 1
          }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter test

      - name: Restaurer la clé de signature
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Build release
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: |
          DEFINES="--dart-define=SPOTIFY_CLIENT_ID=$SPOTIFY_CLIENT_ID --dart-define=SPOTIFY_CLIENT_SECRET=$SPOTIFY_CLIENT_SECRET"
          flutter build apk --release --split-per-abi $DEFINES
          flutter build appbundle --release $DEFINES

      - uses: actions/upload-artifact@v7
        with:
          name: memofix-release
          path: |
            build/app/outputs/flutter-apk/*-release.apk
            build/app/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Publier la GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/*-release.apk
          generate_release_notes: true

      - name: Nettoyer les secrets du runner
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties
