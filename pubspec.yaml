name: memofix
description: "Une application mobile dédiée à la gestion sécurisée de notes, de mémos audio et d’objectifs personnels."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Base de données locale (SQLite)
  sqflite: ^2.3.3
  path_provider: ^2.1.3
  path: ^1.9.1   # utile pour gérer les chemins SQLite

  # Sécurité
  local_auth: ^2.1.7
  flutter_secure_storage: ^9.2.4

  # Notifications
  flutter_local_notifications: ^19.3.0
  timezone: ^0.10.1

  # Audio
  record: ^6.0.0
  just_audio: ^0.10.4
  audio_session: ^0.2.2

  # Fichiers & Images
  image_picker: ^1.1.2
  file_picker: ^10.2.0

  # UI & Animations
  fl_chart: ^1.0.0
  cupertino_icons: ^1.0.6
  animations: ^2.0.11
  shimmer: ^3.0.0

  # Internationalisation
  intl: ^0.18.1

  # Navigation & Design
  go_router: ^14.1.4
  google_fonts: ^6.2.1

  # download song mp3 link
  dio: ^5.9.0
  permission_handler: ^12.0.1

  # get spotify song details
  http: ^1.5.0

  lottie: ^2.7.0
  line_icons: ^2.0.3
  flutter_staggered_grid_view: ^0.7.0
  # flutter_sound: ^9.28.0
  collection: ^1.19.1

dev_dependencies:
  hive_generator: ^2.0.1
  build_runner: ^2.4.9
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  # audioplayers: ^6.5.1



flutter:
  uses-material-design: true
  assets:
    - assets/animations/
    - assets/

flutter_launcher_icons:
  image_path: "assets/sticky-note.png"
  android: true
  ios: true
