name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # lancement manuel depuis l'onglet Actions

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # À aligner sur `flutter --version` en local (Dart >= 3.8.1 requis).
  FLUTTER_VERSION: "3.32.x"

jobs:
  quality:
    name: Format, analyse, tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter --version
      - run: flutter pub get

      # Non bloquant tant que le code n'a pas été formaté une fois.
      # Retirer `continue-on-error` après un premier passage de `dart format .`.
      - name: Formatage
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed .

      # Les "info" ne bloquent pas encore (dette connue : withOpacity, etc.).
      # Retirer --no-fatal-infos une fois la dette résorbée.
      - name: Analyse statique
        run: flutter analyze --no-fatal-infos

      - name: Tests unitaires
        run: flutter test

  secrets-scan:
    name: Détection de secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # historique complet
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-android:
    name: Build APK (debug)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Dossier android/ présent ?
        id: android
        run: |
          if [ -d android/app ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else
            echo "::warning::android/ est absent du dépôt : build ignoré. Voir README."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.android.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        if: steps.android.outputs.present == 'true'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build APK debug
        if: steps.android.outputs.present == 'true'
        run: |
          flutter pub get
          flutter build apk --debug

      - name: Publier l'APK
        if: steps.android.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: memofix-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
